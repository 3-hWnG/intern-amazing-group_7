<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><rect width="1100" height="760" fill="#fcfcfb"/><text x="24" y="36" font-family="Helvetica" font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="bold">Evaluation workflow: lock first, run once</text><text x="24" y="60" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Test sets are locked by SHA-256 and a commit before the code they evaluate; nothing is chosen on a test set.</text><rect x="300" y="86" width="500" height="74" rx="8" fill="#f1f0ec" stroke="#c3c2b7" stroke-width="1.5"/><text x="550.0" y="119.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Pool of 1,490 real citizen questions</text><text x="550.0" y="137.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">two public portals; personal data masked; duplicates removed</text><rect x="40" y="210" width="320" height="92" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="200.0" y="243.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Development set: 282</text><text x="200.0" y="261.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">rules, thresholds and selection</text><text x="200.0" y="279.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">(round 2: + test set 1 = 595)</text><line x1="550" y1="160" x2="208.9095454429505" y2="208.7272077938642" stroke="#52514e" stroke-width="1.6"/><polygon points="200,210 209.61665222413706,213.67695526217005 208.20243866176395,203.77746032555837" fill="#52514e"/><rect x="390" y="210" width="320" height="92" rx="8" fill="#e4effc" stroke="#c3c2b7" stroke-width="1.5"/><text x="550.0" y="243.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Test set 1: 313</text><text x="550.0" y="261.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">random + topical strata</text><text x="550.0" y="279.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">locked 7e78438 before any code change</text><line x1="550" y1="160" x2="550.0" y2="201.0" stroke="#52514e" stroke-width="1.6"/><polygon points="550,210 555.0,201.0 545.0,201.0" fill="#52514e"/><rect x="740" y="210" width="320" height="92" rx="8" fill="#e4effc" stroke="#c3c2b7" stroke-width="1.5"/><text x="900.0" y="243.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Test set 2: 363</text><text x="900.0" y="261.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">random stratum only</text><text x="900.0" y="279.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">order 5499d0f, labels a79ec5f</text><line x1="550" y1="160" x2="891.0904545570495" y2="208.7272077938642" stroke="#52514e" stroke-width="1.6"/><polygon points="900,210 891.797561338236,203.77746032555837 890.383347775863,213.67695526217005" fill="#52514e"/><rect x="40" y="360" width="320" height="92" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="200.0" y="393.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Develop on dev only</text><text x="200.0" y="411.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">rule layer A (round 1), A2 (round 2)</text><text x="200.0" y="429.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">reranker grid, RAG prompt choice</text><line x1="200" y1="302" x2="200.0" y2="351.0" stroke="#52514e" stroke-width="1.6"/><polygon points="200,360 205.0,351.0 195.0,351.0" fill="#52514e"/><rect x="40" y="500" width="320" height="74" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="200.0" y="533.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Freeze the code in a commit</text><text x="200.0" y="551.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">b7010d1 (round 1), 88cabd6 (round 2)</text><line x1="200" y1="452" x2="200.0" y2="491.0" stroke="#52514e" stroke-width="1.6"/><polygon points="200,500 205.0,491.0 195.0,491.0" fill="#52514e"/><rect x="390" y="500" width="670" height="74" rx="8" fill="#e4effc" stroke="#c3c2b7" stroke-width="1.5"/><text x="725.0" y="533.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Run each configuration once on the locked test set</text><text x="725.0" y="551.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">base, A, B, C, A + B, A + C, R; round 2: base, A, A + B, A2 + B, R</text><line x1="360" y1="537" x2="381.0" y2="537.0" stroke="#52514e" stroke-width="1.6"/><polygon points="390,537 381.0,532.0 381.0,542.0" fill="#52514e"/><line x1="550" y1="302" x2="550.0" y2="491.0" stroke="#898781" stroke-width="1.6" stroke-dasharray="5,4"/><polygon points="550,500 555.0,491.0 545.0,491.0" fill="#898781"/><line x1="900" y1="302" x2="900.0" y2="491.0" stroke="#898781" stroke-width="1.6" stroke-dasharray="5,4"/><polygon points="900,500 905.0,491.0 895.0,491.0" fill="#898781"/><rect x="390" y="620" width="320" height="92" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="550.0" y="653.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Read the results once</text><text x="550.0" y="671.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">exact McNemar, Wilson intervals,</text><text x="550.0" y="689.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">paired bootstrap (paired_stats.py)</text><line x1="725" y1="574" x2="558.7043147778273" y2="617.7120086869711" stroke="#52514e" stroke-width="1.6"/><polygon points="550,620 559.9754210628435,622.5477391190974 557.4332084928112,612.8762782548448" fill="#52514e"/><rect x="740" y="620" width="320" height="92" rx="8" fill="#fde9e0" stroke="#c3c2b7" stroke-width="1.5"/><text x="900.0" y="653.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Post hoc, on the frozen code</text><text x="900.0" y="671.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">ablations, gate only, learned gates</text><text x="900.0" y="689.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">a870122, 89e077e (marked * in the paper)</text><line x1="725" y1="574" x2="891.2956852221727" y2="617.7120086869711" stroke="#898781" stroke-width="1.6" stroke-dasharray="5,4"/><polygon points="900,620 892.5667915071888,612.8762782548448 890.0245789371565,622.5477391190974" fill="#898781"/></svg>