<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860"><rect width="1100" height="860" fill="#fcfcfb"/><text x="24" y="36" font-family="Helvetica" font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="bold">System 3: how one question is handled (paper 1)</text><text x="24" y="60" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">The rules decide. The reranker (B) and the LLM reader (C) are optional switches; all switches off gives the base system.</text><rect x="80" y="90" width="520" height="62" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="340.0" y="117.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Browser (web/)</text><text x="340.0" y="135.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">POST /chat with the question text</text><rect x="80" y="180" width="520" height="62" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="340.0" y="207.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">FastAPI server (server/main.py)</text><text x="340.0" y="225.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">one-worker queue</text><rect x="80" y="270" width="520" height="62" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="340.0" y="297.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Orchestrator (server/orchestrator.py)</text><text x="340.0" y="315.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">input checks, conversation state</text><rect x="80" y="360" width="520" height="92" rx="8" fill="#e4effc" stroke="#c3c2b7" stroke-width="1.5"/><text x="340.0" y="393.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Retrieval (retrieval/query.py, rank.py)</text><text x="340.0" y="411.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">normalize: letter stripping, citizen lexicon, focus</text><text x="340.0" y="429.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">rank by Vietnamese-syllable IDF, diacritic penalty</text><rect x="80" y="480" width="520" height="92" rx="8" fill="#e4effc" stroke="#c3c2b7" stroke-width="1.5"/><text x="340.0" y="513.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Policy (server/policy/scope.py, policy.py)</text><text x="340.0" y="531.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">out-of-scope gate, commune-level and province checks</text><text x="340.0" y="549.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">decision: answer / clarify / refuse</text><rect x="80" y="600" width="520" height="92" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="340.0" y="633.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Answerer (server/answer/)</text><text x="340.0" y="651.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">answer composed by code from the procedure record, with sources</text><text x="340.0" y="669.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">LLM rewriting step: off in all experiments</text><rect x="80" y="720" width="520" height="62" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="340.0" y="747.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">JSON response to the browser</text><text x="340.0" y="765.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">kind, answer blocks with sources, clarification card</text><line x1="340.0" y1="152" x2="340.0" y2="171.0" stroke="#52514e" stroke-width="1.6"/><polygon points="340.0,180 345.0,171.0 335.0,171.0" fill="#52514e"/><line x1="340.0" y1="242" x2="340.0" y2="261.0" stroke="#52514e" stroke-width="1.6"/><polygon points="340.0,270 345.0,261.0 335.0,261.0" fill="#52514e"/><line x1="340.0" y1="332" x2="340.0" y2="351.0" stroke="#52514e" stroke-width="1.6"/><polygon points="340.0,360 345.0,351.0 335.0,351.0" fill="#52514e"/><line x1="340.0" y1="452" x2="340.0" y2="471.0" stroke="#52514e" stroke-width="1.6"/><polygon points="340.0,480 345.0,471.0 335.0,471.0" fill="#52514e"/><line x1="340.0" y1="572" x2="340.0" y2="591.0" stroke="#52514e" stroke-width="1.6"/><polygon points="340.0,600 345.0,591.0 335.0,591.0" fill="#52514e"/><line x1="340.0" y1="692" x2="340.0" y2="711.0" stroke="#52514e" stroke-width="1.6"/><polygon points="340.0,720 345.0,711.0 335.0,711.0" fill="#52514e"/><rect x="680" y="270" width="380" height="62" rx="8" fill="#f1f0ec" stroke="#c3c2b7" stroke-width="1.5"/><text x="870.0" y="297.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Session database (system3.db)</text><text x="870.0" y="315.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">messages, plans, traces</text><rect x="680" y="350" width="380" height="82" rx="8" fill="#fde9e0" stroke="#c3c2b7" stroke-width="1.5"/><text x="870.0" y="378.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">B: reranker (retrieval/semantic.py)</text><text x="870.0" y="396.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">BGE-M3 (Ollama) + bge-reranker-v2-m3</text><text x="870.0" y="414.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">refuse below a threshold, swap on a margin</text><rect x="680" y="452" width="380" height="82" rx="8" fill="#fde9e0" stroke="#c3c2b7" stroke-width="1.5"/><text x="870.0" y="480.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">C: LLM reader (server/planner/reader.py)</text><text x="870.0" y="498.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">Qwen3-4B-Instruct-2507 via Ollama, temperature 0</text><text x="870.0" y="516.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">intent + procedure name in words</text><rect x="680" y="560" width="380" height="74" rx="8" fill="#f1f0ec" stroke="#c3c2b7" stroke-width="1.5"/><text x="870.0" y="593.5" font-family="Helvetica" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Procedure database (SQLite, read-only)</text><text x="870.0" y="611.5" font-family="Helvetica" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">1,517 procedures; 542 commune-level in scope</text><line x1="680" y1="301" x2="611.0" y2="301.0" stroke="#898781" stroke-width="1.6"/><polygon points="602,301 611.0,306.0 611.0,296.0" fill="#898781"/><line x1="680" y1="391" x2="611.0" y2="391.0" stroke="#eb6834" stroke-width="1.6"/><polygon points="602,391 611.0,396.0 611.0,386.0" fill="#eb6834"/><line x1="680" y1="493" x2="608.2427751835928" y2="418.4828819214233" stroke="#eb6834" stroke-width="1.6"/><polygon points="602,412 604.6411741161354,421.9510903567527 611.8443762510502,415.01467348609395" fill="#eb6834"/><line x1="680" y1="580" x2="606.2865483368668" y2="443.91362769883096" stroke="#898781" stroke-width="1.6"/><polygon points="602,436 601.8900885041829,446.29504344153474 610.6830081695506,441.5322119561272" fill="#898781"/><line x1="680" y1="615" x2="610.5705405923786" y2="637.2530318614171" stroke="#898781" stroke-width="1.6"/><polygon points="602,640 612.0966340027024,642.0144433016275 609.0444471820548,632.4916204212067" fill="#898781"/><rect x="80" y="818" width="18" height="14" rx="3" fill="#e4effc" stroke="#c3c2b7"/><text x="106" y="830" font-family="Helvetica" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">rule layer A (each rule behind a switch)</text><rect x="420" y="818" width="18" height="14" rx="3" fill="#fde9e0" stroke="#c3c2b7"/><text x="446" y="830" font-family="Helvetica" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">optional learned components (B, C)</text><rect x="720" y="818" width="18" height="14" rx="3" fill="#f1f0ec" stroke="#c3c2b7"/><text x="746" y="830" font-family="Helvetica" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">local data and models</text></svg>